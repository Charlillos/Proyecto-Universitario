<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generar o Evaluar Contraseña</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Goldman", sans-serif;
      color: white;
      text-align: center;
    }

    #video-fondo {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .contenido {
      position: relative;
      z-index: 1;
      margin-top: 15vh;
    }

    input[type="password"],
    input[type="text"] {
      padding: 10px;
      font-size: 1.2rem;
      border: none;
      border-radius: 5px;
      width: 60%;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      margin: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #0ff;
      color: black;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0cc;
    }

    #fortaleza {
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&family=Bitcount+Prop+Double:wght@100..900&family=Bungee&family=Goldman:wght@400;700&family=Jost:ital,wght@0,100..900;1,100..900&family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Oswald:wght@200..700&family=Playwrite+AU+QLD:wght@100..400&display=swap" rel="stylesheet">
  <video id="video-fondo" autoplay loop muted playsinline>
    <source src="https://cdn.pixabay.com/video/2022/11/26/140582-775389269_large.mp4" type="video/mp4">
  </video>

  <div class="contenido">
    <h1>Gestor de Contraseñas</h1>
    <input type="password" id="clave" placeholder="Introduce tu contraseña"><br>

    <button onclick="mostrarOcultar()">Mostrar/Ocultar</button>
    <button onclick="verificarSeguridad()">Comprobar Seguridad</button>
    <button onclick="generarContrasena()">Generar Contraseña Segura</button>

    <div id="fortaleza"></div>
  </div>

  <script>
    function mostrarOcultar() {
      const input = document.getElementById("clave");
      input.type = input.type === "password" ? "text" : "password";
    }

    function verificarSeguridad() {
      const clave = document.getElementById("clave").value;
      const mensaje = document.getElementById("fortaleza");

      let fortaleza = 0;
      if (clave.length >= 8) fortaleza++;
      if (/[A-Z]/.test(clave)) fortaleza++;
      if (/[a-z]/.test(clave)) fortaleza++;
      if (/[0-9]/.test(clave)) fortaleza++;
      if (/[^A-Za-z0-9]/.test(clave)) fortaleza++;

      const niveles = ["Muy débil😰", "Débil🙁", "Aceptable🤞", "Fuerte💪", "Muy fuerte🔥"];
      mensaje.innerText = "Seguridad: " + niveles[fortaleza - 1] || "Vacía";
    }

    function generarContrasena() {
      const longitud = 12;
      const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
      let nueva = "";
      for (let i = 0; i < longitud; i++) {
        nueva += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
      }
      const input = document.getElementById("clave");
      input.type = "text"; // Mostrarla al generarla
      input.value = nueva;

      verificarSeguridad();
    }
  </script>
</body>
</html>
